[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scldl"
version = "0.2.0"
description = "Single-cell label distribution learning and annotation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anndata>=0.10",
    "numpy>=1.24",
    "scanpy>=1.10",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pandas>=2.0",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
bench = [
    "celltypist>=1.6",
    "pandas>=2.0",
]
scanvi = [
    "scvi-tools>=1.1",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
